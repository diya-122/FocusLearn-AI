<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)"/>

  <!-- Graduation cap - brim (flat diamond/rhombus shape) -->
  <polygon points="24,10 40,19 24,24 8,19" fill="url(#capGrad)"/>

  <!-- Cap top (square part) -->
  <rect x="17" y="22" width="14" height="11" rx="2" fill="white" opacity="0.9"/>

  <!-- Tassel string going down from right corner -->
  <line x1="40" y1="19" x2="40" y2="31" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- Tassel ball -->
  <circle cx="40" cy="33" r="2.5" fill="#A5B4FC"/>

  <!-- Small "F" letter mark inside cap -->
  <text x="24" y="31" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#4F46E5" text-anchor="middle" dominant-baseline="middle">FL</text>
</svg>